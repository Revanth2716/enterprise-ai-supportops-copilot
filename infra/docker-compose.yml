version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supportops-postgres
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supportops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp
    container_name: supportops-mcp
    ports:
      - "8001:8001"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: supportops-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/supportops
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=mock
      - AI_MODEL=supportops-mock-v1
      - MCP_SERVER_HOST=mcp-server
      - MCP_SERVER_PORT=8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: supportops-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
